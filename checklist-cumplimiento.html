<style>
  :root{
    --paper:#F2F4FA;
    --paper-2:#E6EAF6;
    --card:#FFFFFF;
    --ink:#161E33;
    --ink-soft:#5A6274;
    --line: rgba(22,30,51,0.13);
    --line-strong: rgba(22,30,51,0.26);
    --brand:#3E71FF;
    --brand-soft:#E7EDFF;
    --seal-green:#1B7A57;
    --seal-green-soft:#E1F2EA;
    --gold:#B4750F;
    --gold-soft:#F8ECD8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Source Serif 4', Georgia, serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:840px;margin:0 auto;padding:28px 22px 60px;}
  .brand-logo{
    height:26px;
    width:auto;
    display:block;
    margin-bottom:14px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .cover{
    border:1px solid var(--line-strong);
    background:
      repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(22,30,51,0.035) 28px);
    background-color:var(--card);
    padding:26px 26px 22px;
    position:relative;
  }
  .cover::before{
    content:"";
    position:absolute; inset:6px;
    border:1px solid var(--line);
    pointer-events:none;
  }
  .cover h1{
    font-family:'Special Elite', 'Courier New', monospace;
    font-weight:400;
    font-size:26px;
    letter-spacing:0.01em;
    margin:10px 0 6px;
    color:var(--ink);
  }
  .cover p{
    margin:0;
    font-size:15px;
    color:var(--ink-soft);
    max-width:56ch;
    line-height:1.55;
  }
  .cover-tag{
    display:inline-flex; align-items:center; gap:6px;
    border:1px solid var(--brand);
    color:var(--brand);
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.12em;
    padding:3px 9px;
    transform:rotate(-2deg);
    margin-top:14px;
  }

  /* ---- form intake ---- */
  .card{
    background:var(--card);
    border:1px solid var(--line-strong);
    padding:22px 24px;
    margin-top:18px;
  }
  .card h2{
    font-family:'Special Elite', monospace;
    font-weight:400;
    font-size:16px;
    margin:0 0 4px;
    color:var(--ink);
  }
  .card .hint{font-size:13px; color:var(--ink-soft); margin:0 0 16px; line-height:1.5;}
  .field{margin-bottom:20px;}
  .field-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:9px;
    display:block;
  }
  .opts{display:flex; flex-wrap:wrap; gap:8px;}
  .opt{
    position:relative;
  }
  .opt input{position:absolute; opacity:0; inset:0; margin:0; cursor:pointer;}
  .opt label{
    display:inline-block;
    padding:8px 13px;
    border:1px solid var(--line-strong);
    font-size:13.5px;
    cursor:pointer;
    background:var(--paper);
    color:var(--ink);
    transition:background .12s, border-color .12s;
  }
  .opt input:checked + label{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--card);
  }
  .opt input:focus-visible + label{ outline:2px solid var(--gold); outline-offset:2px; }

  .btn{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    padding:11px 20px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--card);
    cursor:pointer;
  }
  .btn:hover{background:#28345A;}
  .btn.ghost{
    background:transparent;
    color:var(--ink);
    border:1px solid var(--line-strong);
  }
  .btn.ghost:hover{background:rgba(22,30,51,0.06);}
  .btn.small{padding:7px 12px; font-size:11px;}

  /* ---- dashboard ---- */
  .summary{
    display:flex; gap:18px; align-items:center;
    margin-top:18px;
    border:1px solid var(--line-strong);
    background:var(--card);
    padding:18px 20px;
  }
  .ring-wrap{position:relative; width:78px; height:78px; flex:none;}
  .ring-wrap svg{transform:rotate(-90deg);}
  .ring-pct{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:15px; font-weight:600;
  }
  .summary-txt{flex:1;}
  .summary-txt .n{font-family:'IBM Plex Mono', monospace; font-size:13px; color:var(--ink-soft);}
  .summary-txt h3{margin:2px 0 0; font-family:'Special Elite', monospace; font-weight:400; font-size:16px;}
  .summary-actions{display:flex; gap:8px; flex:none;}

  .tabs{
    display:flex; flex-wrap:wrap; gap:4px;
    margin-top:22px;
  }
  .tab{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    letter-spacing:0.03em;
    padding:9px 13px 8px;
    background:var(--paper-2);
    border:1px solid var(--line-strong);
    border-bottom:none;
    cursor:pointer;
    color:var(--ink-soft);
    clip-path: polygon(6% 0, 94% 0, 100% 100%, 0% 100%);
    display:flex; align-items:center; gap:6px;
  }
  .tab .cnt{opacity:0.7;}
  .tab.active{
    background:var(--card);
    color:var(--ink);
    font-weight:600;
  }
  .tab.done{color:var(--seal-green);}
  .tab .chk{font-size:13px;}

  .panel{
    background:var(--card);
    border:1px solid var(--line-strong);
    padding:6px 4px;
  }
  .item{
    position:relative;
    display:flex; align-items:flex-start; gap:12px;
    padding:13px 18px;
    border-bottom:1px solid var(--line);
  }
  .item:last-child{border-bottom:none;}
  .cb{
    flex:none;
    width:19px; height:19px;
    border:1.5px solid var(--ink-soft);
    margin-top:2px;
    cursor:pointer;
    position:relative;
    background:var(--paper);
  }
  .cb.on{border-color:var(--seal-green); background:var(--seal-green-soft);}
  .cb.on::after{
    content:"";
    position:absolute; left:3px; top:-1px;
    width:6px; height:11px;
    border-right:2px solid var(--seal-green);
    border-bottom:2px solid var(--seal-green);
    transform:rotate(40deg);
  }
  .item-body{flex:1; min-width:0;}
  .item-text{font-size:14.5px; line-height:1.5; cursor:pointer;}
  .item.on .item-text{color:var(--ink-soft); text-decoration:line-through; text-decoration-color:var(--line-strong);}
  .badge{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--gold);
    border:1px solid var(--gold);
    padding:1px 6px;
    margin-left:8px;
    vertical-align:1px;
  }
  .stamp{
    flex:none;
    font-family:'Special Elite', monospace;
    font-size:10px;
    letter-spacing:0.06em;
    color:var(--seal-green);
    border:1.5px solid var(--seal-green);
    padding:3px 8px;
    transform:rotate(-6deg);
    opacity:0.9;
    white-space:nowrap;
  }

  .empty{padding:26px 18px; text-align:center; color:var(--ink-soft); font-size:14px;}

  .foot{
    margin-top:22px;
    font-size:12.5px;
    color:var(--ink-soft);
    line-height:1.6;
    border-top:1px solid var(--line-strong);
    padding-top:14px;
  }
  .foot b{color:var(--ink);}
  .brandmark{
    margin-top:18px;
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.18em;
    color:var(--brand);
  }

  @media (max-width:520px){
    .summary{flex-wrap:wrap;}
    .summary-actions{width:100%; justify-content:flex-end;}
  }
</style>
</head>

const WORKER_MIN = {'0':0, '1-14':1, '15-49':15, '50+':50};

let state = {profile:null, checked:{}, activeCat:'doc'};
let storageAvailable = true;

function loadState(){
  try{
    const raw = window.localStorage.getItem(STORE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      state.profile = parsed.profile || null;
      state.checked = parsed.checked || {};
    }
  }catch(e){
    storageAvailable = false;
  }
}
function saveState(){
  try{
    window.localStorage.setItem(STORE_KEY, JSON.stringify({profile:state.profile, checked:state.checked}));
  }catch(e){
    storageAvailable = false;
  }
}

function applies(item, p){
  if(item.sector && !item.sector.some(s=>p.sectors.includes(s))) return false;
  if(item.hasWorkers && WORKER_MIN[p.workers]===0) return false;
  if(item.minWorkers && WORKER_MIN[p.workers] < item.minWorkers) return false;
  if(item.spe===true && p.spe==='no') return false;
  if(item.spe===false && p.spe==='si') return false;
  if(item.licor && !p.licor) return false;
  if(item.estado && !p.estado) return false;
  return true;
}

function itemsFor(catId, p){
  return ITEMS.filter(i=>i.cat===catId && applies(i,p));
}

function render(){
  const app = document.getElementById('app');
  if(!state.profile){
    app.innerHTML = coverHTML() + formHTML();
    bindForm();
  } else {
    app.innerHTML = coverHTML(true) + dashboardHTML();
    bindDashboard();
  }
}

function formHTML(){
  const p = state.profile || {sectors:[], workers:'1-14', spe:'ns', licor:false, estado:false};
  const sectorOpts = SECTORS.map(s=>`
    <div class="opt">
      <input type="checkbox" id="s_${s.id}" value="${s.id}" ${p.sectors.includes(s.id)?'checked':''}>
      <label for="s_${s.id}">${s.label}</label>
    </div>`).join('');
  const workerOpts = [['0','Aún sin nómina'],['1-14','1 a 14 trabajadores'],['15-49','15 a 49 trabajadores'],['50+','50 o más trabajadores']]
    .map(([v,l])=>`
    <div class="opt">
      <input type="radio" name="workers" id="w_${v}" value="${v}" ${p.workers===v?'checked':''}>
      <label for="w_${v}">${l}</label>
    </div>`).join('');
  const speOpts = [['si','Sujeto Pasivo Especial (SPE)'],['no','Contribuyente ordinario'],['ns','No estoy segura']]
    .map(([v,l])=>`
    <div class="opt">
      <input type="radio" name="spe" id="spe_${v}" value="${v}" ${p.spe===v?'checked':''}>
      <label for="spe_${v}">${l}</label>
    </div>`).join('');
  const yn = (name, val, label)=>['si','no'].map(v=>`
    <div class="opt">
      <input type="radio" name="${name}" id="${name}_${v}" value="${v}" ${(val?'si':'no')===v?'checked':''}>
      <label for="${name}_${v}">${v==='si'?'Sí':'No'}</label>
    </div>`).join('');

  return `
  <div class="card">
    <h2>Perfil de la empresa</h2>
    <p class="hint">Responde estas preguntas para armar tu expediente. Puedes editarlo cuando quieras.</p>

    <div class="field">
      <label class="field-label">Actividad especial (marca si aplica; si ninguna aplica, se asume comercio o servicios general)</label>
      <div class="opts">${sectorOpts}</div>
    </div>

    <div class="field">
      <label class="field-label">Número de trabajadores</label>
      <div class="opts">${workerOpts}</div>
    </div>

    <div class="field">
      <label class="field-label">Clasificación ante el SENIAT</label>
      <div class="opts">${speOpts}</div>
    </div>

    <div class="field">
      <label class="field-label">¿Vende bebidas alcohólicas?</label>
      <div class="opts">${yn('licor', p.licor)}</div>
    </div>

    <div class="field">
      <label class="field-label">¿Contrata o licita con el Estado?</label>
      <div class="opts">${yn('estado', p.estado)}</div>
    </div>

    <button class="btn" id="btnGenerar">Generar mi expediente</button>
  </div>`;
}

function bindForm(){
  document.getElementById('btnGenerar').addEventListener('click', async ()=>{
    const sectors = SECTORS.map(s=>s.id).filter(id=>{
      const el = document.getElementById('s_'+id);
      return el && el.checked;
    });
    const workers = (document.querySelector('input[name="workers"]:checked')||{}).value || '1-14';
    const spe = (document.querySelector('input[name="spe"]:checked')||{}).value || 'ns';
    const licor = ((document.querySelector('input[name="licor"]:checked')||{}).value) === 'si';
    const estado = ((document.querySelector('input[name="estado"]:checked')||{}).value) === 'si';
    state.profile = {sectors, workers, spe, licor, estado};
    state.activeCat = 'doc';
    await saveState();
    render();
  });
}

function ringSVG(pct){
  const r = 32, c = 2*Math.PI*r;
  const off = c - (pct/100)*c;
  return `<svg width="78" height="78" viewBox="0 0 78 78">
    <circle cx="39" cy="39" r="${r}" fill="none" stroke="var(--line-strong)" stroke-width="6"/>
    <circle cx="39" cy="39" r="${r}" fill="none" stroke="var(--seal-green)" stroke-width="6"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"/>
  </svg>`;
}

function dashboardHTML(){
  const p = state.profile;
  let total=0, done=0;
  const catStats = {};
  CATS.forEach(c=>{
    const its = itemsFor(c.id, p);
    const d = its.filter(i=>state.checked[i.id]).length;
    catStats[c.id] = {total: its.length, done: d};
    total += its.length; done += d;
  });
  const pct = total? Math.round(done/total*100) : 0;

  const tabs = CATS.map(c=>{
    const st = catStats[c.id];
    if(st.total===0) return '';
    const isDone = st.done===st.total;
    return `<div class="tab ${c.id===state.activeCat?'active':''} ${isDone?'done':''}" data-cat="${c.id}">
      ${isDone?'<span class="chk">✓</span>':''}${c.label} <span class="cnt">${st.done}/${st.total}</span>
    </div>`;
  }).join('');

  const its = itemsFor(state.activeCat, p);
  const rows = its.length ? its.map(i=>{
    const on = !!state.checked[i.id];
    return `<div class="item ${on?'on':''}" data-id="${i.id}">
      <div class="cb ${on?'on':''}" data-id="${i.id}"></div>
      <div class="item-body">
        <span class="item-text" data-id="${i.id}">${i.t}${i.optional?'<span class="badge">según tu caso</span>':''}</span>
      </div>
      ${on?'<div class="stamp">cumplido</div>':''}
    </div>`;
  }).join('') : `<div class="empty">No hay elementos en esta categoría para el perfil actual.</div>`;

  return `
  <div class="summary">
    <div class="ring-wrap">${ringSVG(pct)}<div class="ring-pct">${pct}%</div></div>
    <div class="summary-txt">
      <div class="n">${done} de ${total} elementos</div>
      <h3>Estado del expediente</h3>
    </div>
    <div class="summary-actions">
      <button class="btn ghost small" id="btnEditar">Editar perfil</button>
      <button class="btn ghost small" id="btnReset">Reiniciar</button>
    </div>
  </div>

  <div class="tabs">${tabs}</div>
  <div class="panel">${rows}</div>

  <div class="foot">
    <b>Nota:</b> esta guía resume la lista general de documentos y permisos aplicables a empresas en Venezuela. No sustituye asesoría legal o contable puntual: algunos organismos y trámites (SIDCAI-FONACIT, SAPI, timbres fiscales, entre otros) dependen del caso específico. Verifica siempre vigencia y aplicabilidad con tu asesor.
    ${storageAvailable ? '' : '<br><b>Aviso:</b> este navegador no permite guardar tu progreso (modo privado o almacenamiento bloqueado); tus marcas no se conservarán al recargar.'}
    <br>Tu perfil y las casillas marcadas se guardan solo en este navegador y dispositivo, nunca se envían a ningún servidor.
  </div>
  <div class="brandmark">BIDA</div>`;
}

function bindDashboard(){
  document.getElementById('btnEditar').addEventListener('click', ()=>{
    document.getElementById('app').innerHTML = coverHTML() + formHTML();
    bindForm();
  });
  document.getElementById('btnReset').addEventListener('click', async ()=>{
    if(!confirm('Esto borra tu perfil y todas las casillas marcadas. ¿Continuar?')) return;
    state = {profile:null, checked:{}, activeCat:'doc'};
    await saveState();
    render();
  });
  document.querySelectorAll('.tab').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.activeCat = el.getAttribute('data-cat');
      render();
    });
  });
  document.querySelectorAll('.cb, .item-text').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const id = el.getAttribute('data-id');
      state.checked[id] = !state.checked[id];
      await saveState();
      render();
    });
  });
}

(async function init(){
  await loadState();
  render();
})();
</script>
</body>
</html>
