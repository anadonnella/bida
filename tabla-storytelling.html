<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tabla de posiciones · Storytelling para Perfiles Técnicos · Bida Global</title>
<style>
  :root{
    --navy:#0D1B4B;
    --navy-dark:#0A1440;
    --accent:#F5A623;
    --light:#F4F5F9;
    --text:#1A2340;
    --muted:#8A93B2;
    --green:#1FAE7A;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:linear-gradient(160deg, var(--navy) 0%, var(--navy-dark) 100%);
    color:#fff; padding:36px 20px;
  }
  .wrap{ max-width:900px; margin:0 auto; }
  .head{ text-align:center; margin-bottom:34px; }
  .logo{ font-family:Georgia,serif; font-weight:800; font-size:30px; color:#fff; }
  .logo span{ color:var(--accent); }
  .tag{ color:var(--accent); font-size:12px; font-weight:700; letter-spacing:3px; margin-top:4px; }
  h1{ font-family:Georgia,serif; font-size:26px; margin:12px 0 4px; }
  .live{
    display:inline-flex; align-items:center; gap:8px; background:rgba(255,255,255,.08);
    padding:6px 16px; border-radius:30px; font-size:12px; font-weight:700; color:var(--accent); margin-top:10px;
  }
  .dot{ width:8px; height:8px; border-radius:50%; background:#E4573D; animation:pulse 1.4s infinite; }
  @keyframes pulse{ 0%{opacity:1;} 50%{opacity:.3;} 100%{opacity:1;} }

  .podium{ display:flex; align-items:flex-end; justify-content:center; gap:16px; margin:36px 0 44px; }
  .pod-col{ text-align:center; width:150px; }
  .pod-avatar{
    width:56px; height:56px; border-radius:50%; background:var(--accent); color:var(--navy-dark);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:20px;
    margin:0 auto 8px; border:3px solid #fff;
  }
  .pod-name{ font-weight:700; font-size:14px; margin-bottom:2px; word-wrap:break-word; }
  .pod-score{ font-size:12px; color:var(--muted); margin-bottom:8px; }
  .pod-bar{ border-radius:10px 10px 0 0; display:flex; align-items:flex-start; justify-content:center; padding-top:10px; font-family:Georgia,serif; font-weight:800; font-size:22px; color:#fff; }
  .pod-1 .pod-bar{ height:150px; background:linear-gradient(180deg,var(--accent),#C9860F); }
  .pod-2 .pod-bar{ height:105px; background:linear-gradient(180deg,#8A93B2,#5B6482); }
  .pod-3 .pod-bar{ height:78px; background:linear-gradient(180deg,#B5793D,#7A4F22); }
  .pod-1 .pod-avatar{ width:70px; height:70px; font-size:26px; }
  .crown{ font-size:22px; }

  table{ width:100%; border-collapse:collapse; background:rgba(255,255,255,.04); border-radius:12px; overflow:hidden; }
  th, td{ padding:12px 18px; text-align:left; font-size:14px; }
  th{ background:rgba(255,255,255,.06); color:var(--accent); font-size:11px; letter-spacing:1px; text-transform:uppercase; }
  tr:nth-child(even) td{ background:rgba(255,255,255,.03); }
  td.rank{ font-weight:800; color:var(--accent); width:50px; }
  td.score{ font-weight:700; text-align:right; }
  .empty{ text-align:center; padding:50px 20px; color:var(--muted); }
  .foot{ text-align:center; color:var(--muted); font-size:12px; margin-top:26px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="logo">BID<span>A</span></div>
    <div class="tag">BIDA GLOBAL · SKILLS PROGRAM</div>
    <h1>Storytelling para Perfiles Técnicos</h1>
    <div class="live"><span class="dot"></span> TABLA EN VIVO</div>
  </div>

  <div id="podiumWrap" class="podium"></div>
  <table>
    <thead><tr><th>#</th><th>Participante</th><th style="text-align:right">Puntaje</th></tr></thead>
    <tbody id="tableBody"></tbody>
  </table>
  <div class="empty" id="emptyMsg" style="display:none;">Aún no hay resultados. Los puntajes aparecerán aquí en cuanto los participantes completen el quiz.</div>

  <p class="foot">Se actualiza automáticamente cada 8 segundos · Storytelling para Perfiles Técnicos</p>
</div>

<script>
/* ============================================================
   CONFIGURACIÓN — pega la MISMA URL de Apps Script que usaste
   en quiz-storytelling.html
   ============================================================ */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyMIWKX18_xCeJSnEySeLxeOK5sgK3jrjmotpXpO_sQjObN0TgN1Y5RoYOSHUjAjqla/exec";
const SESION = "storytelling";
const REFRESH_MS = 8000;

function initials(name){
  return name.trim().split(/\s+/).slice(0,2).map(w => w[0]?.toUpperCase() || '').join('');
}

async function loadLeaderboard(){
  if(!SCRIPT_URL || SCRIPT_URL.indexOf('PEGA_AQUI') === 0){
    document.getElementById('emptyMsg').style.display = 'block';
    document.getElementById('emptyMsg').textContent = 'Falta configurar SCRIPT_URL en este archivo.';
    return;
  }
  try{
    const res = await fetch(`${SCRIPT_URL}?sesion=${SESION}`, { method: 'GET' });
    const data = await res.json();
    render(data.ranking || []);
  }catch(err){
    console.error('Error cargando leaderboard', err);
  }
}

function render(ranking){
  const podiumWrap = document.getElementById('podiumWrap');
  const tableBody = document.getElementById('tableBody');
  const emptyMsg = document.getElementById('emptyMsg');

  if(!ranking.length){
    podiumWrap.innerHTML = '';
    tableBody.innerHTML = '';
    emptyMsg.style.display = 'block';
    return;
  }
  emptyMsg.style.display = 'none';

  const top3 = ranking.slice(0,3);
  const order = [1,0,2].filter(i => top3[i]); // 2do-1ro-3ro visualmente
  podiumWrap.innerHTML = order.map(i => {
    const p = top3[i];
    const place = i+1;
    return `<div class="pod-col pod-${place}">
      <div class="pod-avatar">${initials(p.nombre)}</div>
      <div class="pod-name">${place===1?'<span class="crown">👑</span> ':''}${p.nombre}</div>
      <div class="pod-score">${p.score}/${p.total}</div>
      <div class="pod-bar">${place}</div>
    </div>`;
  }).join('');

  tableBody.innerHTML = ranking.map((p, idx) => `
    <tr>
      <td class="rank">${idx+1}</td>
      <td>${p.nombre}</td>
      <td class="score">${p.score}/${p.total}</td>
    </tr>
  `).join('');
}

loadLeaderboard();
setInterval(loadLeaderboard, REFRESH_MS);
</script>
</body>
</html>
