<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tabla de Posiciones — Módulo 3: Costos</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0f0f1a;min-height:100vh;padding:2rem 1rem;color:#fff}
.wrap{max-width:760px;margin:0 auto}
.header{text-align:center;margin-bottom:1.5rem}
.badge{display:inline-block;background:#e8b14a;color:#1a1a2e;font-size:.75rem;font-weight:700;padding:.25rem .9rem;border-radius:20px;margin-bottom:.75rem;letter-spacing:.06em}
h1{font-size:1.6rem;font-weight:700;color:#fff;margin-bottom:.3rem}
.subtitle{font-size:.9rem;color:#9ca3af}
.grupo-tabs{display:flex;gap:.6rem;justify-content:center;margin:1.25rem 0 1.5rem}
.grupo-tab{padding:.6rem 1.6rem;border-radius:8px;border:1.5px solid #2d2d4e;background:#1a1a2e;color:#9ca3af;font-size:.9rem;font-weight:700;cursor:pointer;transition:all .15s}
.grupo-tab.active{border-color:#e8b14a;background:rgba(232,177,74,.12);color:#e8b14a}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:2rem}
.stat{background:#1a1a2e;border:1px solid #2d2d4e;border-radius:12px;padding:1.25rem;text-align:center}
.stat-num{font-size:2rem;font-weight:700;color:#e8b14a;line-height:1}
.stat-label{font-size:.78rem;color:#9ca3af;margin-top:.3rem}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:1rem;margin-bottom:2rem;min-height:180px}
.podium-col{display:flex;flex-direction:column;align-items:center;gap:.5rem}
.podium-name{font-size:.85rem;font-weight:600;color:#fff;text-align:center;max-width:120px;word-break:break-word}
.podium-score{font-size:.8rem;color:#9ca3af}
.podium-block{width:100px;border-radius:8px 8px 0 0;display:flex;align-items:center;justify-content:center;font-size:1.6rem}
.p1-block{height:130px;background:linear-gradient(180deg,#e8b14a,#c98d1e)}
.p2-block{height:95px;background:linear-gradient(180deg,#9ca3af,#6b7280)}
.p3-block{height:70px;background:linear-gradient(180deg,#cd8a6a,#a06348)}
.medal{font-size:1.8rem}
.list-section{background:#1a1a2e;border:1px solid #2d2d4e;border-radius:12px;overflow:hidden;margin-bottom:1.5rem}
.list-header{display:grid;grid-template-columns:48px 1fr 80px;padding:.75rem 1.25rem;background:#12122a;font-size:.75rem;font-weight:700;color:#6366f1;text-transform:uppercase;letter-spacing:.06em}
.list-row{display:grid;grid-template-columns:48px 1fr 80px;padding:.85rem 1.25rem;border-top:1px solid #2d2d4e;align-items:center;transition:background .2s}
.list-row:hover{background:#12122a}
.list-row.top1{background:rgba(232,177,74,.08)}
.list-row.top2{background:rgba(156,163,175,.05)}
.list-row.top3{background:rgba(205,138,106,.05)}
.pos{font-size:.95rem;font-weight:700;color:#6b7280;text-align:center}
.pos.gold{color:#e8b14a}
.pos.silver{color:#9ca3af}
.pos.bronze{color:#cd8a6a}
.pname{font-size:.95rem;color:#f3f4f6;font-weight:500}
.pscore{font-size:.95rem;font-weight:700;color:#6366f1;text-align:right}
.bar-wrap{height:4px;background:#2d2d4e;border-radius:2px;margin-top:4px}
.bar{height:4px;background:#6366f1;border-radius:2px;transition:width .5s}
.controls{display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap}
.ctrl-btn{padding:.6rem 1.4rem;border-radius:8px;border:1px solid #2d2d4e;background:#1a1a2e;color:#d1d5db;font-size:.85rem;cursor:pointer;transition:all .15s;font-family:inherit}
.ctrl-btn:hover{background:#2d2d4e;color:#fff}
.pulse{width:8px;height:8px;border-radius:50%;background:#22c55e;display:inline-block;margin-right:6px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.status{font-size:.78rem;color:#6b7280;text-align:center;margin-top:.5rem}
.empty{text-align:center;padding:3rem;color:#6b7280;font-size:.9rem}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="badge">BIDA GLOBAL</div>
    <h1>🏆 Tabla de Posiciones</h1>
    <p class="subtitle">Módulo 3: Costos · Ficha de Final · Sección B (conocimiento técnico)</p>
  </div>

  <div class="grupo-tabs">
    <div class="grupo-tab active" id="tab-G1" onclick="selectGrupo('G1')">Grupo 1</div>
    <div class="grupo-tab" id="tab-G2" onclick="selectGrupo('G2')">Grupo 2</div>
  </div>

  <div class="stats-row">
    <div class="stat">
      <div class="stat-num" id="total-part">0</div>
      <div class="stat-label">Participantes</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="avg-score">0</div>
      <div class="stat-label">Promedio aciertos /5</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="perfect-count">0</div>
      <div class="stat-label">Puntaje perfecto (5/5)</div>
    </div>
  </div>

  <div class="podium" id="podium"></div>

  <div class="list-section">
    <div class="list-header">
      <div>#</div><div>Participante</div><div style="text-align:right">Aciertos</div>
    </div>
    <div id="list-body"><div class="empty">Esperando respuestas de la Ficha de Final...</div></div>
  </div>

  <div class="controls">
    <button class="ctrl-btn" onclick="fetchScores()">↻ Actualizar ahora</button>
  </div>
  <div class="status"><span class="pulse"></span><span id="status-txt">Actualizando cada 10 segundos</span></div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxIU66pAzhNMK2rMYNIau893O4bmxbZUqA8ai4S8VDW_WBALOUtUg6XWVi1nt8ZlYz4qg/exec';
let grupoActual = 'G1';

function selectGrupo(g){
  grupoActual = g;
  document.getElementById('tab-G1').classList.toggle('active', g==='G1');
  document.getElementById('tab-G2').classList.toggle('active', g==='G2');
  fetchScores();
}

async function fetchScores(){
  document.getElementById('status-txt').textContent='Actualizando...';
  try{
    const res=await fetch(SCRIPT_URL+'?action=get&grupo='+grupoActual);
    const data=await res.json();
    if(data.ok) renderAll(data.scores);
    document.getElementById('status-txt').textContent='Última actualización: '+new Date().toLocaleTimeString('es-VE');
  }catch(e){
    document.getElementById('status-txt').textContent='Error de conexión — reintentando...';
  }
}

function renderAll(scores){
  const total=scores.length;
  const avg=total?Math.round((scores.reduce((a,b)=>a+Number(b.score),0)/total)*10)/10:0;
  const perfect=scores.filter(s=>Number(s.score)===5).length;

  document.getElementById('total-part').textContent=total;
  document.getElementById('avg-score').textContent=avg;
  document.getElementById('perfect-count').textContent=perfect;

  renderPodium(scores);
  renderList(scores);
}

function renderPodium(scores){
  const top=scores.slice(0,3);
  const blocks=[
    {cls:'p2-block',medal:'🥈',idx:1},
    {cls:'p1-block',medal:'🥇',idx:0},
    {cls:'p3-block',medal:'🥉',idx:2}
  ];
  const p=document.getElementById('podium');
  if(!scores.length){p.innerHTML='';return;}
  p.innerHTML=blocks.map(b=>{
    const s=top[b.idx];
    if(!s) return '';
    return `<div class="podium-col">
      <div class="podium-name">${s.nombre} ${s.apellido}</div>
      <div class="podium-score">${s.score}/5 aciertos</div>
      <div class="podium-block ${b.cls}">${b.medal}</div>
    </div>`;
  }).join('');
}

function renderList(scores){
  const body=document.getElementById('list-body');
  if(!scores.length){body.innerHTML='<div class="empty">Esperando respuestas de la Ficha de Final...</div>';return;}
  const max=Number(scores[0].score)||5;
  const posClass=['top1','top2','top3'];
  const posColor=['gold','silver','bronze'];
  body.innerHTML=scores.map((s,i)=>`
    <div class="list-row ${posClass[i]||''}">
      <div class="pos ${posColor[i]||''}">${i+1}</div>
      <div>
        <div class="pname">${s.nombre} ${s.apellido}</div>
        <div class="bar-wrap"><div class="bar" style="width:${Math.round(Number(s.score)/max*100)}%"></div></div>
      </div>
      <div class="pscore">${s.score}</div>
    </div>`).join('');
}

fetchScores();
setInterval(fetchScores,10000);
</script>
</body>
</html>
