<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz Diplomado Claude IA</title><link rel="stylesheet" href="common.css"></head><body>
<header><b>BIDA GLOBAL</b><h1 id="ttl">Quiz · Diplomado Claude IA</h1></header><main id="app"></main>
<script src="config.js"></script><script src="questions.js"></script><script>
const $=s=>document.querySelector(s),app=$('#app'),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const V=((new URLSearchParams(location.search).get('v')||'A').toUpperCase()==='B')?'B':'A';
const Q=window.QUIZ[V];let name='',i=0,ans=[],t0=0;
$('#ttl').textContent='Quiz de '+(V==='A'?'entrada':'salida')+' · Diplomado Claude IA';
function start(){app.innerHTML=`<div class="card"><p>16 preguntas de selección múltiple. No tiene nota: mide tu punto de partida y, en la sesión 6, cuánto cambiaste.</p><p>Escribe tu <b>nombre real</b> (el mismo en los dos quizzes, para calcular tu desplazamiento).</p><input type="text" id="nm" placeholder="Nombre y apellido" autocomplete="name"><p></p><button id="go">Comenzar</button></div>${CFG.API_URL?'':'<p class="warn">Modo local de prueba: los resultados solo se guardan en este navegador.</p>'}`;
 $('#go').onclick=()=>{name=$('#nm').value.trim();if(name.length<3){$('#nm').focus();return}t0=Date.now();show()}}
function show(){const q=Q[i];app.innerHTML=`<div class="bar"><i style="width:${i/Q.length*100}%"></i></div><p class="note">Pregunta ${i+1} de ${Q.length} · ${q.dim}</p><h2 style="font-size:19px">${q.q}</h2>${q.o.map((t,j)=>`<button class="opt${ans[i]===j?' sel':''}" data-j="${j}">${'ABCD'[j]}) ${t}</button>`).join('')}<p><button class="sec" id="pv" ${i?'':'disabled'}>Anterior</button> <button id="nx" ${ans[i]==null?'disabled':''}>${i==Q.length-1?'Terminar':'Siguiente'}</button></p>`;
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ans[i]=+b.dataset.j;show()});
 $('#pv').onclick=()=>{i--;show()};$('#nx').onclick=()=>{if(i==Q.length-1)finish();else{i++;show()}}}
async function finish(){const dims={};let sc=0;Q.forEach((q,k)=>{const ok=ans[k]===q.k;if(ok)sc++;(dims[q.dim]=dims[q.dim]||[0,0])[1]++;if(ok)dims[q.dim][0]++});
 const rec={ts:new Date().toISOString(),version:V,nombre:name,puntaje:sc,total:Q.length,seg:Math.round((Date.now()-t0)/1000),dims};
 app.innerHTML='<p>Guardando…</p>';let saved=true;
 try{if(CFG.API_URL){await fetch(CFG.API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(rec)})}
  else{const a=JSON.parse(localStorage.getItem('bida_quiz')||'[]');a.push(rec);localStorage.setItem('bida_quiz',JSON.stringify(a))}}catch(e){saved=false}
 app.innerHTML=`<div class="card"><h2 style="margin-top:0">${esc(name)}, tu puntaje: ${sc} de ${Q.length}</h2><p class="note">${saved?'Resultado enviado al podio.':'No se pudo guardar: avisa a la facilitadora.'}</p>
 <table><tr><th>Dimensión</th><th>Aciertos</th></tr>${Object.entries(dims).map(([k,v])=>`<tr><td>${k}</td><td>${v[0]} de ${v[1]}</td></tr>`).join('')}</table>
 <p class="note">Con 2 preguntas por dimensión, la lectura por dimensión es orientativa.</p></div>`}
start();
</script></body></html>
