<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reporting contable</title>
<style>
:root{
  color-scheme:light;
  --page:#e9ecf1; --surface:#ffffff; --ink:#0b0b0b; --ink2:#454a54; --muted:#6c727d;
  --grid:#e3e5ea; --axis:#c3c7d0; --border:rgba(11,20,40,.14); --ghost:rgba(11,20,40,.05); --thbg:#f1f3f7;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s7:#6250d6; --s8:#e34948;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b; --goodtxt:#006300;
  --goodbg:rgba(12,163,12,.14); --warnbg:rgba(250,178,25,.26); --critbg:rgba(208,59,59,.14);
  --p1:#e3edfb; --p2:#fbeedd; --p3:#ece8fa; --band:#10243e; --shadow:0 1px 2px rgba(11,20,40,.08),0 4px 14px rgba(11,20,40,.06);
}
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --page:#090b0f; --surface:#171a20; --ink:#f0efec; --ink2:#c3c7d0; --muted:#97a0ad;
    --grid:#262a32; --axis:#3a3f49; --border:rgba(255,255,255,.14); --ghost:rgba(255,255,255,.06); --thbg:#1e222a;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s7:#9085e9; --s8:#e66767; --goodtxt:#3ccf3c;
    --goodbg:rgba(60,207,60,.16); --warnbg:rgba(250,178,25,.2); --critbg:rgba(230,103,103,.2);
    --p1:#0f1b2c; --p2:#241b0e; --p3:#18142b; --band:#05080d; --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#090b0f; --surface:#171a20; --ink:#f0efec; --ink2:#c3c7d0; --muted:#97a0ad;
  --grid:#262a32; --axis:#3a3f49; --border:rgba(255,255,255,.14); --ghost:rgba(255,255,255,.06); --thbg:#1e222a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s7:#9085e9; --s8:#e66767; --goodtxt:#3ccf3c;
  --goodbg:rgba(60,207,60,.16); --warnbg:rgba(250,178,25,.2); --critbg:rgba(230,103,103,.2);
  --p1:#0f1b2c; --p2:#241b0e; --p3:#18142b; --band:#05080d; --shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
button,select,input[type=search],input[type=number]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 11px}
button{cursor:pointer}
button:hover{background:var(--ghost)}
a{color:inherit}

/* ----- barra superior fija ----- */
.top{position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.band{background:var(--band);color:#fff}
.band .in{max-width:1320px;margin:0 auto;padding:12px 20px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
.band h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.band .sub{color:#c3cede;font-size:12.5px;margin-top:1px}
.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.cur{display:flex;align-items:center;gap:10px}
.cur .lab{font-size:12px;color:#c3cede;text-transform:uppercase;letter-spacing:.06em}
.seg{display:inline-flex;background:rgba(255,255,255,.14);border-radius:999px;padding:3px}
.seg button{background:transparent;border:0;color:#fff;border-radius:999px;padding:7px 20px;font-weight:700;font-size:15px;min-width:74px}
.seg button:hover{background:rgba(255,255,255,.12)}
.seg button[aria-pressed="true"]{background:#fff;color:#10243e;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.ghostbtn{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:999px;padding:8px 14px;font-size:13px}
.ghostbtn:hover{background:rgba(255,255,255,.22)}
nav{background:var(--surface);border-bottom:1px solid var(--border)}
nav .in{max-width:1320px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto}
nav a{white-space:nowrap;padding:12px 14px;color:var(--ink2);text-decoration:none;border-bottom:3px solid transparent;font-size:14.5px;font-weight:550}
nav a:hover{color:var(--ink);background:var(--ghost)}
nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--s1);font-weight:700}

main{max-width:1320px;margin:0 auto;padding:20px}

/* ----- cifras principales ----- */
.hero{background:var(--band);color:#fff;border-radius:18px;padding:20px;margin-bottom:22px;box-shadow:var(--shadow)}
.hero .ttl{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;margin-bottom:14px}
.hero .ttl b{font-size:15px;letter-spacing:.02em}
.hero .ttl span{color:#c3cede;font-size:13px}
.hgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.hk{background:rgba(255,255,255,.09);border-radius:14px;padding:16px 18px;border-top:4px solid var(--c)}
.hk .l{color:#c3cede;font-size:13.5px;font-weight:600}
.hk .v{font-size:44px;font-weight:750;letter-spacing:-.02em;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}
.hk .v small{font-size:20px;font-weight:600;color:#c3cede;margin-left:6px;letter-spacing:0}
.hk .f{color:#b3c0d3;font-size:12.5px;margin-top:6px;font-variant-numeric:tabular-nums}

/* ----- paneles de sección ----- */
.panel{border-radius:18px;margin-bottom:24px;border:1px solid var(--border);overflow:hidden;box-shadow:var(--shadow);background:var(--pbg)}
.panel>header{display:flex;gap:14px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);border-left:8px solid var(--pc)}
.panel .num{flex:none;width:38px;height:38px;border-radius:50%;background:var(--pc);color:#fff;font-weight:800;font-size:19px;display:grid;place-items:center}
.panel h2{margin:0;font-size:20px;font-weight:750;letter-spacing:-.01em}
.panel header p{margin:2px 0 0;color:var(--ink2);font-size:13.5px}
.panel .body{padding:20px}
.p1{--pbg:var(--p1);--pc:var(--s1)} .p2{--pbg:var(--p2);--pc:var(--s2)} .p3{--pbg:var(--p3);--pc:var(--s7)}

.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr))}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px}
.stat .l{color:var(--ink2);font-size:13.5px;font-weight:600}
.stat .v{font-size:34px;font-weight:750;margin-top:4px;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
.stat .v small{font-size:16px;font-weight:600;color:var(--muted);margin-left:4px;letter-spacing:0}
.stat .s{color:var(--muted);font-size:12.5px;margin-top:4px}

/* ----- salud financiera ----- */
.sumrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:6px 14px 6px 10px;font-size:14px;font-weight:700}
.pill.good{background:var(--goodbg)} .pill.warn{background:var(--warnbg)} .pill.crit{background:var(--critbg)}
.grp{margin:20px 0 10px;font-size:13px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);display:flex;align-items:center;gap:10px}
.grp:after{content:"";flex:1;height:1px;background:var(--border)}
.kpi{background:var(--surface);border:1px solid var(--border);border-top:6px solid var(--c);border-radius:14px;padding:16px 18px}
.kpi .l{font-size:14px;font-weight:700}
.kpi .v{white-space:nowrap;font-size:40px;font-weight:800;letter-spacing:-.025em;line-height:1.1;margin-top:8px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:20px;font-weight:650;color:var(--muted);margin-left:5px;letter-spacing:0}
.kpi .st{display:inline-flex;align-items:center;gap:7px;margin-top:10px;border-radius:999px;padding:4px 12px 4px 8px;font-size:13.5px;font-weight:700}
.kpi .st.good{background:var(--goodbg)} .kpi .st.warn{background:var(--warnbg)} .kpi .st.crit{background:var(--critbg)}
.kpi .h{color:var(--muted);font-size:12.5px;margin-top:10px;line-height:1.35}
.kpi .th{color:var(--muted);font-size:12px;margin-top:3px}

/* ----- reportes (resumen) ----- */
.rep{display:block;text-decoration:none;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;transition:transform .12s,box-shadow .12s;border-top:6px solid var(--c)}
.rep:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.rep .t{font-weight:750;font-size:16px;display:flex;justify-content:space-between;gap:8px}
.rep .t span{color:var(--muted);font-weight:500}
.rep .hv{font-size:28px;font-weight:780;letter-spacing:-.02em;margin-top:8px;font-variant-numeric:tabular-nums;line-height:1.15}
.rep .hv small{font-size:14px;font-weight:600;color:var(--muted);margin-left:4px}
.rep .hl{color:var(--ink2);font-size:13px;margin-top:2px}
.rep .d{color:var(--muted);font-size:12.5px;margin-top:8px}
.cbox{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px}
.cbox h3{margin:0 0 12px;font-size:16px;font-weight:750}
.cbox.wide{grid-column:1/-1}

/* ----- gráficos HTML ----- */
.bl{display:flex;flex-direction:column;gap:10px}
.bl-r{display:grid;grid-template-columns:minmax(96px,150px) 1fr minmax(92px,auto);gap:12px;align-items:center}
.bl-l{font-size:14px;color:var(--ink)}
.bl-t{height:26px;background:var(--ghost);border-radius:6px;position:relative}
.bl-b{position:absolute;top:0;bottom:0;border-radius:6px;background:var(--s1)}
.bl-v{font-size:15px;font-weight:750;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bl-v small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.er .bl-r{grid-template-columns:minmax(120px,38%) 1fr minmax(92px,auto)}
.er .ax{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--axis)}
.sb{display:flex;height:46px;border-radius:8px;overflow:hidden;gap:2px;margin-bottom:6px}
.sb div{display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;min-width:3px;overflow:hidden;white-space:nowrap}
.sbl{font-size:14px;font-weight:700;margin:12px 0 6px}
.legend{display:flex;gap:8px 20px;flex-wrap:wrap;font-size:13.5px;color:var(--ink2);margin:14px 0 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:7px;vertical-align:-1px}
.legend b{color:var(--ink)}

/* ----- tablas y formularios ----- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:20px;box-shadow:var(--shadow)}
.card h2{margin:0 0 4px;font-size:20px;font-weight:750}
.card .note{color:var(--ink2);font-size:13.5px;margin:0 0 14px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 12px;border-bottom:1px solid var(--grid);text-align:left;vertical-align:top}
th{position:sticky;top:0;background:var(--thbg);color:var(--ink);font-weight:700;font-size:13px;z-index:1;border-bottom:2px solid var(--axis)}
tbody tr:hover td{background:var(--ghost)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.sec td{background:var(--p1);font-weight:750;border-top:2px solid var(--axis)}
tr.sub td{font-weight:700;background:var(--ghost)}
tr.tot td{font-weight:800;border-top:2px solid var(--ink);background:var(--thbg)}
tr.ok td:last-child{color:var(--goodtxt);font-weight:700}
.scroll{overflow:auto;max-height:70vh;border:1px solid var(--border);border-radius:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.row label{color:var(--ink2);font-size:13.5px}
.warnbox{border:1px solid var(--warn);background:var(--warnbg);border-radius:10px;padding:10px 14px;margin:0 0 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.infobox{border:1px solid var(--border);background:var(--ghost);border-radius:10px;padding:9px 14px;margin:0 0 14px;font-size:13.5px;color:var(--ink2)}
details{margin-top:14px}
details summary{cursor:pointer;color:var(--ink2);font-size:14px;font-weight:600}
#tt{position:fixed;pointer-events:none;background:var(--ink);color:var(--surface);padding:7px 10px;border-radius:8px;font-size:13px;z-index:50;display:none;max-width:280px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.thr input{width:92px;text-align:right}
footer{max-width:1320px;margin:0 auto;padding:4px 20px 36px;color:var(--muted);font-size:12.5px}
.csvb{margin-left:auto}
@media (max-width:700px){
  .top{position:static}
  main{padding:12px}
  .band .in{padding:12px}
  .band h1{font-size:19px}
  .hk .v{font-size:34px} .kpi .v{font-size:38px} .stat .v{font-size:28px}
  .panel>header{padding:12px 14px} .panel .body{padding:12px}
  .bl-r{grid-template-columns:84px 1fr auto;gap:8px}
  .er .bl-r{grid-template-columns:96px 1fr auto}
  .seg button{padding:7px 16px;min-width:64px}
}
@media print{.top .tools,nav,details,.csvb{display:none} .top{position:static} body{background:#fff}}
</style>
</head>
<body>
<div class="top">
  <div class="band"><div class="in">
    <div>
      <h1>Reporting contable</h1>
      <div class="sub" id="sub"></div>
    </div>
    <div class="tools">
      <div class="cur">
        <span class="lab">Ver todo en</span>
        <div class="seg" role="group" aria-label="Moneda">
          <button id="mBs" aria-pressed="true" title="Bolívares">Bs</button>
          <button id="mUsd" aria-pressed="false" title="Dólares a la tasa de cierre">US$</button>
        </div>
      </div>
      <button id="tema" class="ghostbtn" title="Cambiar tema claro/oscuro">Claro / oscuro</button>
    </div>
  </div></div>
  <nav><div class="in" id="nav"></div></nav>
</div>
<main id="main"></main>
<footer id="foot"></footer>
<div id="tt" role="tooltip"></div>
<script src="data.js"></script>
<script>
(function(){
"use strict";
var D = window.REPORTING_DATA;
var M = obj(["mayor","aux","prov","cuentas","tdc","desde","hasta","corte","tcierre","plazo","cxpcorte"], D.meta);
var R = obj(["activo","pasivo","patrimonio","ctrlEcu","resOper","resPer","resAcum","ctrlBal","ctrlEFE","ctrlCxP","flOp","flInv","flFin","varEf","efIni","efFin"], D.res);
var TASAS = [["Tasa de Cambio",D.tasas[0]],["Tasa al Cierre",D.tasas[1]],["Tasa Indexa",D.tasas[2]]];
function obj(k,v){var o={};for(var i=0;i<k.length;i++)o[k[i]]=v[i];return o}
var moneda = "Bs";
var LS = {get:function(k){try{return localStorage.getItem(k)}catch(e){return null}}, set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------- formato ---------- */
var nf = new Intl.NumberFormat("es-VE",{minimumFractionDigits:2,maximumFractionDigits:2});
function fmt(n){ if(n===null||n===undefined||isNaN(n)) return "-"; if(Math.abs(n)<0.005) return "-"; return nf.format(n); }
function fmtM(n){ return new Intl.NumberFormat("es-VE",{maximumFractionDigits:1}).format(n/1e6)+" M"; }
function fmtS(n){ var a=Math.abs(n); if(a>=1e6) return fmtM(n); if(a>=1e3) return new Intl.NumberFormat("es-VE",{maximumFractionDigits:1}).format(n/1e3)+" mil"; return new Intl.NumberFormat("es-VE",{maximumFractionDigits:0}).format(n); }
function pct(n){ return new Intl.NumberFormat("es-VE",{minimumFractionDigits:1,maximumFractionDigits:1}).format(n*100)+" %"; }
function pctN(n){ return new Intl.NumberFormat("es-VE",{minimumFractionDigits:1,maximumFractionDigits:1}).format(n*100); }
function fx(n){ return new Intl.NumberFormat("es-VE",{minimumFractionDigits:2,maximumFractionDigits:2}).format(n); }
function ent(n){ return new Intl.NumberFormat("es-VE").format(n); }
function fecha(s){ return s? s.slice(8,10)+"/"+s.slice(5,7)+"/"+s.slice(0,4) : ""; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]}); }
function sum(a,i){ var t=0; for(var k=0;k<a.length;k++) t+=(a[k][i]||0); return t; }
function mon(){ return moneda==="Bs"?0:1; }
function cu(){ return moneda==="Bs"?"Bs":"US$"; }
function cv(bs){ return moneda==="Bs"?bs:bs/M.tcierre; }          /* convierte Bs a la moneda elegida (USD a tasa de cierre) */
function conTasa(){ return moneda==="USD"?"Cifras en US$ convertidas a la tasa de cierre ("+fx(M.tcierre)+" Bs por US$).":""; }

/* ---------- datos derivados ---------- */
var ESF = D.esf, ER = D.er;
function esfSec(sec,idx){ var t=0; ESF.forEach(function(r){ if(r[0]===sec) t+=(r[idx]||0); }); return t; }
function esfLin(l,idx){ var t=0; ESF.forEach(function(r){ if(r[1]===l) t+=(r[idx]||0); }); return t; }
function erLin(l,idx){ var t=0; ER.forEach(function(r){ if(r[1]===l) t+=(r[idx]||0); }); return t; }
function erSum(idx){ return ER.reduce(function(t,r){return t+(r[idx]||0)},0); }
var AC=esfSec("Activo corriente",2), ANC=esfSec("Activo no corriente",2), PC=esfSec("Pasivo corriente",2);
var INV=esfLin("Inventarios",2), ING=erLin("Ingresos de actividades ordinarias",2);
var AG = D.aging;
var PEND=sum(AG,2), PV=sum(AG,3), TOP5=AG.slice().sort(function(a,b){return (b[2]||0)-(a[2]||0)}).slice(0,5).reduce(function(t,r){return t+(r[2]||0)},0);
var CON_SALDO = AG.filter(function(r){return (r[2]||0)>0.005}).length;
/* totales en la moneda elegida */
function tot(){
  var k=mon()===0?2:3, ka=mon()===0?3:5, kp=mon()===0?2:4;
  var ac=esfSec("Activo corriente",k), anc=esfSec("Activo no corriente",k), pc=esfSec("Pasivo corriente",k);
  var pat=esfSec("Patrimonio",k)+erSum(ka);
  return {ac:ac,anc:anc,pc:pc,pat:pat,activo:ac+anc,pasivo:pc,res:erSum(kp),efFin:cv(R.efFin),varEf:cv(R.varEf)};
}

var IND = [
 {grp:"Liquidez", k:"liq", n:"Liquidez corriente", f:"x", dir:"up", g:1, a:0.8, h:"Activo corriente / Pasivo corriente", v:AC/PC},
 {grp:"Liquidez", k:"acida", n:"Prueba ácida", f:"x", dir:"up", g:0.8, a:0.6, h:"(Activo corriente − Inventarios) / Pasivo corriente", v:(AC-INV)/PC},
 {grp:"Liquidez", k:"efec", n:"Razón de efectivo", f:"x", dir:"up", g:0.3, a:0.2, h:"Efectivo / Pasivo corriente", v:R.efFin/PC},
 {grp:"Liquidez", k:"ct", n:"Capital de trabajo", f:"m", dir:"up", g:0, a:0, h:"Activo corriente − Pasivo corriente", vf:function(){var t=tot();return t.ac-t.pc}},
 {grp:"Solvencia", k:"end", n:"Endeudamiento", f:"p", dir:"down", g:0.6, a:0.75, h:"Pasivo / Activo", v:R.pasivo/R.activo},
 {grp:"Solvencia", k:"pat", n:"Patrimonio / Activo", f:"p", dir:"up", g:0.3, a:0.2, h:"Patrimonio (con resultado acumulado) / Activo", v:R.patrimonio/R.activo},
 {grp:"Rentabilidad y flujo", k:"mop", n:"Margen operativo", f:"p", dir:"up", g:0.15, a:0.05, h:"Resultado de operación / Ingresos del período", v:R.resOper/ING},
 {grp:"Rentabilidad y flujo", k:"mne", n:"Margen neto", f:"p", dir:"up", g:0.10, a:0.03, h:"Resultado del período / Ingresos del período", v:R.resPer/ING},
 {grp:"Rentabilidad y flujo", k:"vef", n:"Variación neta de efectivo", f:"m", dir:"up", g:0, a:0, h:"Flujo neto de efectivo del período", vf:function(){return tot().varEf}},
 {grp:"Cuentas por pagar", k:"venc", n:"CxP vencido", f:"p", dir:"down", g:0.2, a:0.4, h:"CxP vencidas / CxP pendientes", v:(PEND-PV)/PEND},
 {grp:"Cuentas por pagar", k:"top5", n:"Concentración en 5 mayores proveedores", f:"p", dir:"down", g:0.4, a:0.6, h:"Pendiente de los 5 mayores / total pendiente", v:TOP5/PEND}
];
(function(){ var s=LS.get("umbrales"); if(!s) return; try{ var o=JSON.parse(s); IND.forEach(function(i){ if(o[i.k]){ i.g=o[i.k][0]; i.a=o[i.k][1]; } }); }catch(e){} })();
function refrescarInd(){ IND.forEach(function(i){ if(i.vf) i.v=i.vf(); }); }
function estado(i){
  var v=i.v;
  if(i.dir==="up"){ if(v>=i.g) return "good"; if(v>=i.a) return "warn"; return "crit"; }
  if(v<=i.g) return "good"; if(v<=i.a) return "warn"; return "crit";
}
var ST = {good:["Adecuado","var(--good)"], warn:["Atención","var(--warn)"], crit:["Crítico","var(--crit)"]};
function icono(s,sz){
  var c=ST[s][1]; sz=sz||18;
  if(s==="good") return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="'+c+'"/><path d="M4.6 8.3l2.3 2.3 4.5-4.8" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  if(s==="warn") return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5l7 12.5H1z" fill="'+c+'" stroke="'+c+'" stroke-linejoin="round"/><path d="M8 6v3.6M8 11.4v.2" stroke="#0b0b0b" stroke-width="1.7" stroke-linecap="round"/></svg>';
  return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="'+c+'"/><path d="M5.2 5.2l5.6 5.6M10.8 5.2l-5.6 5.6" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>';
}
function indParts(i){
  if(i.f==="x") return [fx(i.v),"x"];
  if(i.f==="p") return [pctN(i.v),"%"];
  return [(i.v<0?"−":"+")+fmtS(Math.abs(i.v)),cu()];
}
function fmtUmb(i,x){ return i.f==="p"? (x*100) : x; }

var tt=document.getElementById("tt");

function csv(nombre,cols,rows){
  var out=[cols.map(function(c){return c.t}).join(";")];
  rows.forEach(function(r){ var cells=r.c||r; out.push(cells.map(function(v){ return typeof v==="number"? String(v).replace(".",",") : '"'+String(v==null?"":v).replace(/"/g,'""')+'"'; }).join(";")); });
  var b=new Blob(["﻿"+out.join("\r\n")],{type:"text/csv;charset=utf-8"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=nombre+".csv"; document.body.appendChild(a); a.click(); setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);

function chartAging(){

  vals.forEach(function(v,i){

  });

function chartEstructura(){
  var t=tot();
  function barra(etq,segs){
    var T=segs.reduce(function(a,s){return a+Math.max(s.v,0)},0)||1, h='<div class="sbl">'+etq+' · '+fmtS(T)+' '+cu()+'</div><div class="sb">';

    return h+'</div>';
  }
  var items=[{n:"Activo corriente",v:t.ac,c:"var(--s1)"},{n:"Activo no corriente",v:t.anc,c:"var(--s3)"},{n:"Pasivo corriente",v:t.pc,c:"var(--s2)"},{n:"Patrimonio (con resultado acumulado)",v:t.pat,c:"var(--s7)"}];
  var leg='<div class="legend">'+items.map(function(s){return '<span><i style="background:'+s.c+'"></i>'+s.n+' <b>'+fmtS(s.v)+'</b></span>'}).join("")+'</div>';

function chartER(){
  var k=mon()===0?2:4, rows=ER.map(function(r){return [r[1],r[k]||0]}).sort(function(a,b){return b[1]-a[1]});
  var pos=Math.max.apply(null,rows.map(function(r){return Math.max(r[1],0)}).concat([1])), neg=Math.max.apply(null,rows.map(function(r){return Math.max(-r[1],0)}).concat([0]));
  var scale=pos+neg, mid=Math.min(Math.max(neg/scale*100,0),45); if(neg>0&&mid<12) mid=12; /* posición del eje */
  var sc=Math.max(pos/(100-mid), neg>0?neg/mid:0);
  var h='<div class="bl er">';
  rows.forEach(function(r){
    var w=Math.abs(r[1])/sc, left=r[1]>=0?mid:mid-w;
    h+='<div class="bl-r" data-tt="'+esc(r[0]+"<br><b>"+fmt(r[1])+" "+cu()+"</b>")+'"><div class="bl-l">'+esc(r[0])+'</div><div class="bl-t"><div class="ax" style="left:'+mid+'%"></div><div class="bl-b" style="left:'+left+'%;width:'+Math.max(w,.4)+'%;background:'+(r[1]>=0?'var(--s1)':'var(--s8)')+'"></div></div><div class="bl-v">'+(r[1]<0?"−":"")+fmtS(Math.abs(r[1]))+'</div></div>';
  });
  h+='</div><div class="legend"><span><i style="background:var(--s1)"></i>Ingreso</span><span><i style="background:var(--s8)"></i>Gasto</span></div>';
  return h;
}

function vESF(){

  var erAc=erSum(mon()===0?3:5);

    var ls=ESF.filter(function(r){return r[0]===sec}).sort(function(a,b){return a[1]<b[1]?-1:1});
    rows.push({cls:"sec",c:[sec,""]});
    ls.forEach(function(r){ rows.push(["   "+r[1],r[k]||0]); });

  var nota=moneda==="USD"?"En US$ se muestra el valor histórico de cada factura (a la tasa del día del documento).":"En Bs históricos.";
  return '<div class="card"><h2>Antigüedad de saldos de cuentas por pagar</h2><p class="note">Vencimiento = fecha del documento + '+M.plazo+' días. Los pagos se aplican a las facturas más antiguas primero. El saldo anterior envejece como una factura fechada el día previo al primer movimiento del auxiliar. Corte: '+fecha(M.cxpcorte)+'. Los saldos a favor (anticipos) no se incluyen. '+nota+'</p><div class="row"><input id="qa" type="search" placeholder="Buscar proveedor" value="'+esc(qAn)+'"><label><input type="checkbox" id="solo"'+(soloSaldo?' checked':'')+'> Solo con saldo</label>'+bloqueCSV("Antiguedad-CxP-"+moneda,cols,out)+'</div>'+tabla(cols,out)+'</div>';
}
var tasaSel=2;
function vIndexa(){
  var tasa=TASAS[tasaSel][1], usd=moneda==="USD", tc=M.tcierre;
  var rows=AG.filter(function(r){return (r[2]||0)>0.005}).sort(function(a,b){return (b[2]||0)-(a[2]||0)});
  var out, cols, P=sum(rows,2), U=sum(rows,8), act=U*tasa;
  if(usd){
    out=rows.map(function(r){ var a=(r[8]||0)*tasa; return [r[1],r[8]||0,(r[2]||0)/tc,tasa,a/tc,(a-(r[2]||0))/tc]; });
    out.push({cls:"tot",c:["TOTAL",U,P/tc,tasa,act/tc,(act-P)/tc]});
    cols=[{t:"Proveedor"},{t:"Pendiente US$ (histórico)",n:1},{t:"Pendiente US$ (a tasa de cierre)",n:1},{t:"Tasa Bs/US$",n:1},{t:"Monto actualizado US$",n:1},{t:"Monto a revaluar US$",n:1}];
  } else {
    out=rows.map(function(r){ var a=(r[8]||0)*tasa; return [r[1],r[2]||0,r[8]||0,tasa,a,a-(r[2]||0)]; });
    out.push({cls:"tot",c:["TOTAL",P,U,tasa,act,act-P]});
    cols=[{t:"Proveedor"},{t:"Pendiente Bs (histórico)",n:1},{t:"Pendiente US$ (histórico)",n:1},{t:"Tasa Bs/US$",n:1},{t:"Monto actualizado Bs",n:1},{t:"Monto a revaluar Bs",n:1}];
  }
  var av = (TASAS[tasaSel][0]==="Tasa Indexa" && Math.abs(tasa-1000)<0.0001)? '<div class="warnbox"><span>'+icono("warn")+'</span><span><b>Tasa Indexa = 1.000,00</b> es el valor de relleno de la tabla de tasas (TDC). El monto actualizado no es real hasta cargar las tasas indexadas.</span></div>':'';
  var opts=TASAS.map(function(t,i){return '<option value="'+i+'"'+(i===tasaSel?' selected':'')+'>'+t[0]+' ('+fx(t[1])+')</option>'}).join("");
  return '<div class="card"><h2>Indexación (revaluación) de cuentas por pagar</h2><p class="note">Monto actualizado = pendiente en US$ histórico (a la tasa del día de cada documento) × tasa elegida al corte. Monto a revaluar = actualizado − Bs históricos.'+(usd?' En US$ se divide entre la tasa de cierre.':'')+'</p>'+av+'<div class="row"><label for="tasa">Tasa para indexar</label><select id="tasa">'+opts+'</select>'+bloqueCSV("Indexacion-CxP-"+moneda,cols,out)+'</div>'+tabla(cols,out)+'</div>';
}
var provSel=null;
function movProv(id){ return D.mov.filter(function(m){return m[0]===id}).sort(function(a,b){ return a[1]<b[1]?-1:a[1]>b[1]?1:(a[6]-b[6]); }); }
function vEdo(){
  var nom={}; AG.forEach(function(r){nom[r[0]]=r[1]});
  var ids=AG.slice().sort(function(a,b){return a[1]<b[1]?-1:1});
  if(provSel===null){ provSel=AG.slice().sort(function(a,b){return (b[2]||0)-(a[2]||0)})[0][0]; }
  var ms=movProv(provSel), saldo=0, td=0, th=0, out=[];
  ms.forEach(function(m){ var si=m[3]||0,d=m[4]||0,h=m[5]||0; saldo=saldo-si-d+h; td+=d; th+=h; out.push([fecha(m[1]),m[2],cv(d),cv(h),cv(saldo)]); });
  out.push({cls:"tot",c:["Total","",cv(td),cv(th),cv(saldo)]});
  var cols=[{t:"Fecha"},{t:"Comprobante"},{t:"Debe "+cu(),n:1},{t:"Haber "+cu(),n:1},{t:"Saldo acreedor "+cu(),n:1}];
  var opts=ids.map(function(r){return '<option value="'+esc(r[0])+'"'+(r[0]===provSel?' selected':'')+'>'+esc(r[0]+" - "+r[1])+'</option>'}).join("");
  var pr=AG.filter(function(r){return r[0]===provSel})[0];
  return '<div class="card"><h2>Estado de cuenta de proveedor</h2><p class="note">Movimientos del auxiliar con saldo acreedor corrido (positivo = se debe). La primera fila es el saldo anterior. Pendiente de pago al corte: <b>'+fmt(cv(pr?pr[2]:0))+' '+cu()+'</b>.</p>'+aviso()+'<div class="row"><label for="prov">Proveedor</label><select id="prov" style="max-width:100%">'+opts+'</select>'+bloqueCSV("Estado-cuenta-"+provSel+"-"+moneda,cols,out)+'</div>'+tabla(cols,out)+'</div>';
}

/* ---------- enrutado ---------- */
var main=document.getElementById("main"), nav=document.getElementById("nav");
function actual(){ var h=(location.hash||"#resumen").slice(1); return VISTAS.some(function(v){return v[0]===h})?h:"resumen"; }
function render(){
  var a=actual(); lastTable=null;
  nav.innerHTML=VISTAS.map(function(v){return '<a href="#'+v[0]+'"'+(v[0]===a?' aria-current="page"':'')+'>'+v[1]+'</a>'}).join("");
  main.innerHTML = ({resumen:vResumen,esf:vESF,er:vER,efe:vEFE,balance:vBalance,antig:vAntig,indexa:vIndexa,edocta:vEdo})[a]();
  document.getElementById("mBs").setAttribute("aria-pressed",String(moneda==="Bs"));
  document.getElementById("mUsd").setAttribute("aria-pressed",String(moneda==="USD"));
  document.getElementById("sub").textContent=(moneda==="Bs"?"Cifras en bolívares":"Cifras en dólares a la tasa de cierre "+fx(M.tcierre))+" · corte "+fecha(M.corte)+" · período "+fecha(M.desde)+" a "+fecha(M.hasta)+" · foto del "+fecha(D.generado.slice(0,10));
  hookCSV(); enlazar(a);
}
function enlazar(a){
  var q;
  if(a==="resumen"){
    Array.prototype.forEach.call(document.querySelectorAll(".thr input"),function(inp){ inp.onchange=function(){
      var o={}; IND.forEach(function(i){ var g=document.querySelector('input[data-k="'+i.k+'"][data-p="0"]'), c=document.querySelector('input[data-k="'+i.k+'"][data-p="1"]');
        var gv=parseFloat(g.value), cv_=parseFloat(c.value); if(i.f==="p"){gv/=100;cv_/=100;} if(!isNaN(gv)&&!isNaN(cv_)){ i.g=gv; i.a=cv_; } o[i.k]=[i.g,i.a]; });
      LS.set("umbrales",JSON.stringify(o)); render(); var d2=document.querySelectorAll("details"); if(d2.length) d2[0].open=true; }; });
    var rb=document.getElementById("umbReset"); if(rb) rb.onclick=function(){ LS.set("umbrales",""); location.reload(); };
  }
  if(a==="balance"){ q=document.getElementById("qb"); q.oninput=function(){ qBal=q.value.toLowerCase(); var p=q.selectionStart; render(); var n=document.getElementById("qb"); n.focus(); n.setSelectionRange(p,p); }; }
  if(a==="antig"){ q=document.getElementById("qa"); q.oninput=function(){ qAn=q.value.toLowerCase(); var p=q.selectionStart; render(); var n=document.getElementById("qa"); n.focus(); n.setSelectionRange(p,p); };
    document.getElementById("solo").onchange=function(e){ soloSaldo=e.target.checked; render(); }; }
  if(a==="indexa"){ document.getElementById("tasa").onchange=function(e){ tasaSel=+e.target.value; render(); }; }
  if(a==="edocta"){ document.getElementById("prov").onchange=function(e){ provSel=e.target.value; render(); }; }
}
function setMoneda(m){ moneda=m; LS.set("moneda",m); render(); }
document.getElementById("mBs").onclick=function(){setMoneda("Bs")};
document.getElementById("mUsd").onclick=function(){setMoneda("USD")};
document.getElementById("tema").onclick=function(){
  var r=document.documentElement, cur=r.getAttribute("data-theme"), osDark=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches;
  var next=(cur||(osDark?"dark":"light"))==="dark"?"light":"dark"; r.setAttribute("data-theme",next); LS.set("tema",next);
};
(function(){ var t=LS.get("tema"); if(t) document.documentElement.setAttribute("data-theme",t); var m=LS.get("moneda"); if(m==="USD"||m==="Bs") moneda=m; })();
window.addEventListener("hashchange",function(){ render(); window.scrollTo(0,0); });
document.getElementById("foot").textContent="Foto de datos del modelo de reporting (Mayor, auxiliar de CxP y tasas). Los umbrales del semáforo son valores de referencia editables, no una norma. En US$, los montos sin tasa propia se convierten a la tasa de cierre del corte.";
render();
})();
</script>
